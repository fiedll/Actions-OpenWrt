name: OpenWrt Builder

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - main

concurrency:
  group: openwrt-360t7-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Free disk space & setup swap
      # ============================================================
      - name: Free disk space & Setup Swap
        run: |
          set -eux

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          sudo docker image prune -af || true

          sudo swapoff -a || true
          sudo rm -f /swapfile

          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h
          df -h

      # ============================================================
      # Initialize build environment
      # ============================================================
      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip vim wget xmlto xxd zlib1g-dev dwarves clang llvm lld

          sudo timedatectl set-timezone "$TZ"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CLANG_PATH=""
          for candidate in clang clang-14 clang-15 clang-16 clang-17 clang-18; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CLANG_PATH="$(command -v "$candidate")"
              break
            fi
          done

          LLVM_STRIP_PATH=""
          for candidate in llvm-strip llvm-strip-14 llvm-strip-15 llvm-strip-16 llvm-strip-17 llvm-strip-18; do
            if command -v "$candidate" >/dev/null 2>&1; then
              resolved="$(readlink -f "$(command -v "$candidate")")"
              if [ -x "$resolved" ] && "$resolved" --version 2>&1 | grep -qi 'llvm'; then
                LLVM_STRIP_PATH="$resolved"
                break
              fi
            fi
          done

          if [ -z "$LLVM_STRIP_PATH" ]; then
            for candidate in /usr/lib/llvm-*/bin/llvm-strip /usr/bin/llvm-strip-*; do
              if [ -x "$candidate" ]; then
                resolved="$(readlink -f "$candidate")"
                if [ -x "$resolved" ] && "$resolved" --version 2>&1 | grep -qi 'llvm'; then
                  LLVM_STRIP_PATH="$resolved"
                  break
                fi
              fi
            done
          fi

          if [ -z "$CLANG_PATH" ] || [ ! -x "$CLANG_PATH" ]; then
            echo "ERROR: clang executable not found."
            exit 1
          fi

          if [ -z "$LLVM_STRIP_PATH" ] || [ ! -x "$LLVM_STRIP_PATH" ]; then
            echo "ERROR: llvm-strip executable not found."
            exit 1
          fi

          CLANG_PATH="$(readlink -f "$CLANG_PATH")"
          LLVM_STRIP_PATH="$(readlink -f "$LLVM_STRIP_PATH")"

          sudo ln -sf "$CLANG_PATH" /usr/bin/clang || true
          sudo ln -sf "$LLVM_STRIP_PATH" /usr/bin/llvm-strip || true

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "LLVM_STRIP_PATH=$LLVM_STRIP_PATH" >> "$GITHUB_ENV"

          echo "========== TOOLCHAIN =========="
          echo "CLANG_PATH=$CLANG_PATH"
          echo "LLVM_STRIP_PATH=$LLVM_STRIP_PATH"
          "$CLANG_PATH" --version | head -n 1
          "$LLVM_STRIP_PATH" --version | head -n 1
          pahole --version || true
          echo "==============================="

      # ============================================================
      # Clone Source Code
      # ============================================================
      - name: Clone source code
        run: |
          set -eux
          git clone \
            --depth 1 \
            --single-branch \
            --branch "$REPO_BRANCH" \
            "$REPO_URL" \
            openwrt

      # ============================================================
      # Cache OpenWrt download files
      # ============================================================
      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-v2-${{ runner.os }}-${{ hashFiles('.config', 'diy-part2.sh', '.github/workflows/openwrt-builder.yml') }}
          restore-keys: |
            openwrt-dl-v2-${{ runner.os }}-

      # ============================================================
      # Cache ccache
      # ============================================================
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-v2-${{ runner.os }}-${{ hashFiles('.config', 'diy-part2.sh', '.github/workflows/openwrt-builder.yml') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-

      # ============================================================
      # Load custom feeds
      # ============================================================
      - name: Load custom feeds
        run: |
          set -eux
          if [ -f "$FEEDS_CONF" ]; then
            cp "$FEEDS_CONF" openwrt/feeds.conf.default
          fi

          [ -f "$DIY_P1_SH" ] && chmod +x "$DIY_P1_SH"
          [ -f "$DIY_P2_SH" ] && chmod +x "$DIY_P2_SH"

          if [ -f "$DIY_P1_SH" ]; then
            cd openwrt
            "$GITHUB_WORKSPACE/$DIY_P1_SH"
          fi

      # ============================================================
      # Update & Install feeds
      # ============================================================
      - name: Update & Install feeds
        run: |
          set -eux
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # Load custom configuration and packages
      # ============================================================
      - name: Load custom configuration
        run: |
          set -eux

          if [ -d files ]; then
            cp -r files openwrt/files
          fi

          if [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" openwrt/.config
          fi

          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      # ============================================================
      # Generate configuration
      # ============================================================
      - name: Generate configuration
        run: |
          set -eux
          cd openwrt

          make defconfig

          echo "========== TARGET CHECK =========="
          grep '^CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y' .config

          echo "========== BTF / TOOLCHAIN CHECK =========="
          grep -E '^(CONFIG_BPF_TOOLCHAIN_HOST|CONFIG_KERNEL_DEBUG_INFO_BTF)' .config || true

      # ============================================================
      # Download package sources
      # ============================================================
      - name: Download packages
        run: |
          set -eux
          cd openwrt
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete || true

      # ============================================================
      # Compile firmware
      # ============================================================
      - name: Compile firmware
        run: |
          set -eux
          cd openwrt

          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE=2G
          ccache --zero-stats || true

          test -x "$CLANG_PATH"
          test -x "$LLVM_STRIP_PATH"

          if ! make \
            -j"$(nproc)" \
            CLANG="$CLANG_PATH" \
            LLVM_STRIP="$LLVM_STRIP_PATH" \
            CONFIG_BPF_TOOLCHAIN_HOST_PATH="/usr/bin"
          then
            echo "========== PARALLEL BUILD FAILED =========="
            echo "Re-running with -j1 V=s for error diagnostics."
            make -j1 V=s CLANG="$CLANG_PATH" LLVM_STRIP="$LLVM_STRIP_PATH" || true
            exit 1
          fi

          ccache --show-stats || true

          DEVICE_NAME=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | head -n 1)
          [ -z "$DEVICE_NAME" ] && DEVICE_NAME="qihoo_360t7"
          echo "DEVICE_NAME=_$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      # ============================================================
      # Check firmware
      # ============================================================
      - name: Check firmware
        run: |
          set -eux
          cd openwrt

          test -d bin/targets/mediatek/filogic

          echo "========== Built Packages =========="
          find bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) | head -30 || true

          echo "========== Images =========="
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f\n' | sort

      # ============================================================
      # Organize files
      # ============================================================
      - name: Organize files
        run: |
          set -eux
          cd openwrt/bin/targets/mediatek/filogic
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

      # ============================================================
      # Upload artifact
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # Upload release
      # ============================================================
      - name: Upload release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 360T7-$(date +"%Y.%m.%d-%H%M")
          name: ImmortalWrt 360T7 Firmware Release
          files: ${{ env.FIRMWARE }}/*
          fail_on_unmatched_files: false
