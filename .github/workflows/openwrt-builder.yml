name: OpenWrt Builder

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - main

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # Free disk space & setup swap
      # ============================================================
      - name: Free disk space & Setup Swap
        run: |
          set -eux

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          sudo docker image prune -af || true

          sudo swapoff -a || true
          sudo rm -f /swapfile

          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h
          df -h

      # ============================================================
      # Initialize build environment
      # ============================================================
      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lrzsz \
            mkisofs \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            dwarves \
            clang \
            llvm \
            lld

          sudo timedatectl set-timezone "$TZ"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CLANG_PATH="$(command -v clang || true)"
          LLVM_STRIP_PATH="$(command -v llvm-strip-14 || command -v llvm-strip || true)"

          if [ -z "$CLANG_PATH" ] || [ ! -x "$CLANG_PATH" ]; then
            echo "ERROR: clang executable not found."
            find /usr -type f -name clang -executable 2>/dev/null | head -50 || true
            exit 1
          fi

          if [ -z "$LLVM_STRIP_PATH" ] || [ ! -x "$LLVM_STRIP_PATH" ]; then
            echo "ERROR: llvm-strip executable not found."
            find /usr -type f -name llvm-strip -executable 2>/dev/null | head -50 || true
            exit 1
          fi

          CLANG_PATH="$(readlink -f "$CLANG_PATH")"
          LLVM_STRIP_PATH="$(readlink -f "$LLVM_STRIP_PATH")"

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "LLVM_STRIP_PATH=$LLVM_STRIP_PATH" >> "$GITHUB_ENV"

          echo "========== TOOLCHAIN =========="
          echo "CLANG_PATH=$CLANG_PATH"
          echo "LLVM_STRIP_PATH=$LLVM_STRIP_PATH"
          "$CLANG_PATH" --version | head -n 1
          llvm-config --version || true
          "$LLVM_STRIP_PATH" --version | head -n 1
          pahole --version || true
          go version || true
          git --version
          echo "==============================="

      # ============================================================
      # Clone ImmortalWrt
      # ============================================================
      - name: Clone source code
        run: |
          set -eux

          git clone \
            --depth 1 \
            --single-branch \
            --branch "$REPO_BRANCH" \
            "$REPO_URL" \
            openwrt

          cd openwrt

          echo "ImmortalWrt commit:"
          git log -1 --oneline

      # ============================================================
      # Cache OpenWrt download files
      #
      # IMPORTANT:
      # The old cache included dl/go-mod-cache.
      # That cache caused missing Go module files during sing-box build.
      #
      # We deliberately use a NEW cache namespace and remove
      # go-mod-cache immediately after restore.
      # ============================================================
      - name: Cache OpenWrt downloads
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: openwrt-dl-v2-${{ runner.os }}-${{ hashFiles('.config', 'diy-part2.sh', '.github/workflows/openwrt-builder.yml') }}
          restore-keys: |
            openwrt-dl-v2-${{ runner.os }}-

      # ============================================================
      # Remove potentially corrupted Go module cache
      # ============================================================
      - name: Reset Go module cache
        run: |
          set -eux

          cd openwrt

          rm -rf dl/go-mod-cache
          rm -rf tmp/go-build

          mkdir -p dl
          mkdir -p tmp

          echo "Go module cache has been reset."

      # ============================================================
      # Cache ccache
      # ============================================================
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-v2-${{ runner.os }}-${{ hashFiles('.config', 'diy-part2.sh', '.github/workflows/openwrt-builder.yml') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-

      # ============================================================
      # Load custom feeds
      # ============================================================
      - name: Load custom feeds
        run: |
          set -eux

          if [ -f "$FEEDS_CONF" ]; then
            mv "$FEEDS_CONF" openwrt/feeds.conf.default
          fi

          chmod +x "$DIY_P1_SH"
          chmod +x "$DIY_P2_SH"

          cd openwrt

          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      # ============================================================
      # Update feeds
      # ============================================================
      - name: Update feeds
        run: |
          set -eux

          cd openwrt

          ./scripts/feeds update -a

      # ============================================================
      # Install feeds
      # ============================================================
      - name: Install feeds
        run: |
          set -eux

          cd openwrt

          ./scripts/feeds install -a

      # ============================================================
      # Load custom configuration and packages
      # ============================================================
      - name: Load custom configuration
        run: |
          set -eux

          if [ -d files ]; then
            rm -rf openwrt/files
            mv files openwrt/files
          fi

          if [ -f "$CONFIG_FILE" ]; then
            mv "$CONFIG_FILE" openwrt/.config
          fi

          chmod +x "$DIY_P2_SH"

          cd openwrt

          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      # ============================================================
      # Generate configuration
      # ============================================================
      - name: Generate configuration
        run: |
          set -eux

          cd openwrt

          make defconfig

          echo "========== TARGET =========="
          grep '^CONFIG_TARGET_' .config | grep '=y' || true
          echo "============================"

          grep \
            "^CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y" \
            .config

          echo "========== IMPORTANT PACKAGES =========="
          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|sing-box|daed|luci-app-daed|mosdns|luci-app-mosdns)' \
            .config || true
          echo "========================================"

      # ============================================================
      # Check custom packages
      # ============================================================
      - name: Check custom packages
        run: |
          set -eux

          cd openwrt

          echo "========== Daed =========="
          find package -maxdepth 3 \
            \( -iname '*daed*' -o -iname 'luci-app-daed' \) \
            -print || true

          echo "========== PassWall =========="
          find package/passwall \
            -maxdepth 2 \
            -type f \
            -name 'Makefile' \
            -print || true

          echo "========== PassWall Packages =========="
          find package/passwall-packages \
            -maxdepth 3 \
            -type f \
            -name 'Makefile' \
            -print | head -100 || true

          echo "========== MosDNS =========="
          find package/mosdns \
            -maxdepth 3 \
            -type f \
            -name 'Makefile' \
            -print || true

          echo "========== sing-box =========="
          find package/passwall-packages \
            -path '*sing-box*' \
            -print | head -50 || true

      # ============================================================
      # Download package sources
      # ============================================================
      - name: Download packages
        run: |
          set -eux

          cd openwrt

          make download -j"$(nproc)"

          echo "========== Small files in dl =========="
          find dl -type f -size -1024c -print -exec ls -lh {} \; || true

          find dl -type f -size -1024c -delete

      # ============================================================
      # IMPORTANT:
      # Do not reuse the old/incomplete Go module cache.
      #
      # sing-box uses:
      #   dl/go-mod-cache
      #
      # The previous failed build showed missing internal packages
      # from several modules.
      # ============================================================
      - name: Reset Go cache before compile
        run: |
          set -eux

          cd openwrt

          rm -rf dl/go-mod-cache
          rm -rf tmp/go-build

          mkdir -p dl/go-mod-cache
          mkdir -p tmp/go-build

          echo "Clean Go module cache:"
          du -sh dl/go-mod-cache || true

      # ============================================================
      # Compile firmware
      # ============================================================
      - name: Compile firmware
        run: |
          set -eux

          cd openwrt

          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE=2G

          export MAKEFLAGS="-j$(nproc)"

          echo "========================================"
          echo "CPU Threads: $(nproc)"
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h
          echo "========================================"

          ccache --zero-stats || true

          test -x "$CLANG_PATH"
          test -x "$LLVM_STRIP_PATH"

          make \
            -j"$(nproc)" \
            CLANG="$CLANG_PATH" \
            LLVM_STRIP="$LLVM_STRIP_PATH"

          echo "========== CCACHE STATS =========="
          ccache --show-stats || true

          echo "========== TARGET DEVICE =========="
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config || true

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' \
            > DEVICE_NAME

          if [ -s DEVICE_NAME ]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          fi

          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      # ============================================================
      # Check firmware
      # ============================================================
      - name: Check firmware
        run: |
          set -eux

          cd openwrt

          test -d bin/targets/mediatek/filogic

          echo "========== Firmware =========="
          ls -lah bin/targets/mediatek/filogic/

          echo "========== Images =========="
          find bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ============================================================
      # Organize files
      # ============================================================
      - name: Organize files
        run: |
          set -eux

          cd openwrt/bin/targets/mediatek/filogic

          rm -rf packages

          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

          echo "========== Final firmware =========="
          ls -lah

      # ============================================================
      # Upload artifact
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # Generate release information
      # ============================================================
      - name: Generate release info
        id: tag
        run: |
          set -eux

          RELEASE_TAG="$(date +"%Y.%m.%d-%H%M")"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "Device: 360T7" > release.txt
          echo "Platform: MT7981 Filogic" >> release.txt
          echo "Source: ImmortalWrt Master" >> release.txt
          echo "Build Date: $(date +"%Y-%m-%d %H:%M:%S")" >> release.txt

          if [ -f openwrt/DEVICE_NAME ]; then
            echo "Device Name: $(cat openwrt/DEVICE_NAME)" >> release.txt
          fi

      # ============================================================
      # Upload release
      # ============================================================
      - name: Upload release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          fail_on_unmatched_files: true
